#!/usr/bin/env python
# Live-tunable costmap knobs (dynamic_reconfigure). Named "CostmapTuning" so the
# generated g1_costmap::CostmapTuningConfig does not clash with the core
# g1_costmap::CostmapConfig struct. Structural params (resolution, margin,
# frames, topics, rates, robot_radius, ground-surface params) are static YAML.
PACKAGE = "g1_costmap"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Ground-relative obstacle band (offset in layers from the per-cell ground).
gen.add("walkable_layers", int_t, 0,
        "Cells within +/- this many layers of ground are FREE (walkable margin)",
        1, 0, 10)
gen.add("obstacle_max_height", double_t, 0,
        "Safety cap on the band top above ground (m); the lidar plane normally bites first",
        2.0, 0.1, 4.0)
gen.add("dyn_decay_half_life", double_t, 0,
        "Dynamic change layer: evidence relaxes toward neutral by half each (s)",
        3.0, 0.1, 60.0)
gen.add("dyn_add_thr", double_t, 0,
        "Dynamic change layer: P(occ) at/above which a live obstacle is added",
        0.65, 0.51, 0.99)
gen.add("dyn_clear_thr", double_t, 0,
        "Dynamic change layer: P(free) bar to CLEAR a static obstacle (door open; HIGH)",
        0.85, 0.51, 0.999)
gen.add("dyn_obstacle_frac", double_t, 0,
        "Dynamic change layer: in-band return fraction to mark a cell obstacle (ring suppression)",
        0.4, 0.0, 1.0)
gen.add("dyn_min_returns", int_t, 0,
        "Dynamic change layer: returns needed in a cell to apply the fraction test",
        3, 1, 50)
gen.add("inflation_radius", double_t, 0,
        "Inflation: cost decays to free at this distance from an obstacle (m)",
        0.45, 0.0, 5.0)
gen.add("cost_scaling_factor", double_t, 0,
        "Inflation: exponential falloff rate past the inscribed radius",
        3.0, 0.1, 20.0)

exit(gen.generate(PACKAGE, "g1_costmap", "CostmapTuning"))
