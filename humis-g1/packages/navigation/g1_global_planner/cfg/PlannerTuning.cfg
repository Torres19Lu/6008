#!/usr/bin/env python
# Live-tunable global planner knobs (dynamic_reconfigure). Named "PlannerTuning"
# so the generated g1_global_planner::PlannerTuningConfig does not clash with
# the core g1_global_planner::PlannerConfig struct. Structural params (frames,
# topics, rates, max_expansions, allow_corner_cutting) are static YAML.
PACKAGE = "g1_global_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# A* cost model.
gen.add("lethal_threshold", int_t, 0,
        "Block at/above this value: 99 blocks inscribed(99)+lethal(100) for travel",
        99, 1, 100)
gen.add("allow_unknown", bool_t, 0,
        "Allow planning through unknown (-1) cells",
        False)
gen.add("inflation_cost_weight", double_t, 0,
        "Step-cost penalty scale for inflation cells (1..99); higher = stays further from obstacles",
        3.0, 0.0, 50.0)
gen.add("heuristic_weight", double_t, 0,
        "A* heuristic weight: 1.0 = optimal, >1.0 = weighted (faster, suboptimal)",
        1.0, 1.0, 5.0)
gen.add("smooth_enable", bool_t, 0,
        "Enable line-of-sight post-processing smoother",
        True)
gen.add("goal_snap_radius", double_t, 0,
        "Snap blocked start/goal to nearest free cell within this radius (m); 0 = off",
        0.3, 0.0, 2.0)

# Goal-local relax (Track B).
gen.add("goal_relax_enable", bool_t, 0,
        "Relax inscribed(99) to traversable within goal_relax_radius of the goal",
        True)
gen.add("goal_relax_radius", double_t, 0,
        "Radius of the goal-local relax disk (m); 0 = off",
        0.6, 0.0, 3.0)

# Replan trigger.
gen.add("replan_on_block", bool_t, 0,
        "Replan each tick when the stored path is blocked by new obstacles",
        True)

exit(gen.generate(PACKAGE, "g1_global_planner", "PlannerTuning"))
