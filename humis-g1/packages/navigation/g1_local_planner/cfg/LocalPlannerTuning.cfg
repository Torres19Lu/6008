#!/usr/bin/env python
# Live-tunable local planner knobs (dynamic_reconfigure). Named "LocalPlannerTuning"
# so the generated g1_local_planner::LocalPlannerTuningConfig does not clash with
# the core g1_local_planner::MpcConfig struct. Structural params (horizon, dt,
# frames, topics, rates) are static YAML and not exposed here.
PACKAGE = "g1_local_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Reference speed.
gen.add("v_ref", double_t, 0,
        "Nominal cruise speed for the arc-length reference (m/s)",
        0.5, 0.0, 2.0)

# Velocity box constraints.
gen.add("max_vx", double_t, 0,
        "Maximum forward speed (m/s)",
        0.5, 0.0, 2.0)
gen.add("min_vx", double_t, 0,
        "Minimum forward speed; allows slow reverse (m/s)",
        -0.3, -1.0, 0.0)
gen.add("max_vy", double_t, 0,
        "Maximum lateral speed (m/s, symmetric)",
        0.3, 0.0, 1.0)
gen.add("max_wz", double_t, 0,
        "Maximum yaw rate (rad/s, symmetric)",
        0.8, 0.0, 3.0)

# Slew / acceleration limits.
gen.add("acc_lim_x", double_t, 0,
        "Maximum longitudinal acceleration/deceleration (m/s^2); matched to "
        "g1_locomotion ax_max for honest braking",
        0.5, 0.1, 10.0)
gen.add("acc_lim_y", double_t, 0,
        "Maximum lateral acceleration/deceleration (m/s^2)",
        1.0, 0.1, 10.0)
gen.add("acc_lim_theta", double_t, 0,
        "Maximum yaw angular acceleration (rad/s^2)",
        1.5, 0.1, 10.0)

# Goal tolerances.
gen.add("xy_goal_tolerance", double_t, 0,
        "Position tolerance for GOAL_REACHED (m)",
        0.05, 0.01, 2.0)
gen.add("yaw_goal_tolerance", double_t, 0,
        "Heading tolerance for GOAL_REACHED (rad)",
        0.03, 0.01, 1.57)

# Terminal behaviour.
gen.add("goal_align_radius", double_t, 0,
        "Switch heading reference to goal yaw and decelerate within this radius (m)",
        0.5, 0.0, 5.0)

# Clean termination near obstacles (Track A).
gen.add("reach_on_path_end", bool_t, 0,
        "Judge GOAL_REACHED against the path endpoint + a no-progress stall, not the raw goal",
        True)
gen.add("reach_stall_progress", double_t, 0,
        "Min reduction in dist-to-path-end per window to count as progress (m)",
        0.01, 0.0, 0.5)
gen.add("reach_stall_cycles", int_t, 0,
        "Consecutive no-progress near-end cycles before latching GOAL_REACHED",
        15, 1, 200)
gen.add("reach_stall_radius", double_t, 0,
        "Near-end gate for the stall latch (m); decoupled from goal_align_radius",
        0.15, 0.02, 1.0)
gen.add("reach_goal_gap", double_t, 0,
        "If the path endpoint is within this of the raw goal, judge + track the raw "
        "goal; else fall back to the path endpoint (m)",
        0.15, 0.0, 1.0)
gen.add("goal_obstacle_relax_radius", double_t, 0,
        "Within this distance of a reachable goal, scale the MPC soft obstacle weight "
        "(terminal approach into an inscribed-band goal); 0 disables (m)",
        0.6, 0.0, 2.0)
gen.add("goal_obstacle_relax_scale", double_t, 0,
        "w_obstacle multiplier applied inside goal_obstacle_relax_radius "
        "(0 = full suppression; 1 = no change)",
        0.0, 0.0, 1.0)

# Speed regulation: shape the arc-length reference speed.
gen.add("a_lat_max", double_t, 0,
        "Max lateral acceleration for the curvature speed regulator (m/s^2)",
        0.5, 0.0, 5.0)
gen.add("a_decel", double_t, 0,
        "Approach decel-to-stop rate; lower = gentler/earlier slow-down into the goal "
        "(should be <= acc_lim_x) (m/s^2)",
        0.2, 0.0, 5.0)
gen.add("curv_lookahead", double_t, 0,
        "Forward arc length scanned for path curvature (m)",
        0.6, 0.05, 5.0)
gen.add("heading_slow_start", double_t, 0,
        "Heading error where translation slowdown begins (rad)",
        0.3, 0.0, 3.14)
gen.add("heading_slow_full", double_t, 0,
        "Heading error at which the speed factor hits the floor (rad)",
        1.0, 0.0, 3.14)
gen.add("heading_slow_floor", double_t, 0,
        "Lower bound on the heading speed factor [0,1]",
        0.0, 0.0, 1.0)
gen.add("v_min_move", double_t, 0,
        "Floor for the cruise regulators; excludes the approach ramp (m/s)",
        0.05, 0.0, 0.5)

# Cost weights.
gen.add("w_pos", double_t, 0,
        "Path-tracking position weight (penalises p_k - p_ref_k)",
        10.0, 0.0, 500.0)
gen.add("w_yaw", double_t, 0,
        "Heading tracking weight (face travel direction / goal yaw)",
        2.0, 0.0, 100.0)
gen.add("w_obstacle", double_t, 0,
        "Linearised obstacle penalty (push down-gradient away from obstacles); SOFT "
        "secondary nudge, the global path is the primary avoider",
        2.0, 0.0, 500.0)
gen.add("w_effort", double_t, 0,
        "Control effort weight (penalises ||u_k||^2)",
        0.1, 0.0, 10.0)
gen.add("w_lateral", double_t, 0,
        "Strafe penalty (penalises vy_k^2)",
        2.0, 0.0, 100.0)
gen.add("w_rate", double_t, 0,
        "Control rate weight (penalises ||u_k - u_{k-1}||^2)",
        0.5, 0.0, 50.0)
gen.add("w_pos_terminal", double_t, 0,
        "Terminal position weight at step N (higher emphasis on final state)",
        30.0, 0.0, 1000.0)
gen.add("w_yaw_terminal", double_t, 0,
        "Terminal heading weight at step N",
        8.0, 0.0, 200.0)

# Oscillation control (Track C).
gen.add("obstacle_nominal_damping", double_t, 0,
        "Blend the warm-start obstacle nominal toward the reference (0=off, 1=full)",
        0.5, 0.0, 1.0)
gen.add("vy_suppress_cost", double_t, 0,
        "Max footprint normalized cost gating near-obstacle strafe suppression",
        0.5, 0.0, 1.0)
gen.add("vy_suppress_scale", double_t, 0,
        "Factor applied to vy near obstacles (1.0 = off)",
        0.6, 0.0, 1.0)

# Footprint safety filter: post-MPC hard guarantee that the footprint never
# overlaps a lethal cell. enabled + brake_margin are live; the footprint geometry
# itself is static YAML.
gen.add("safety_filter_enabled", bool_t, 0,
        "Enable the post-MPC footprint safety filter (veto/scale the command so the "
        "footprint never overlaps a lethal cell)",
        True)
gen.add("safety_brake_margin", double_t, 0,
        "Braking-distance margin on the footprint clear distance (m)",
        0.05, 0.0, 0.5)
gen.add("safety_footprint_collision_margin", double_t, 0,
        "Dilate each footprint circle for the hard collision check (m; 0 = pure footprint)",
        0.0, 0.0, 0.3)

exit(gen.generate(PACKAGE, "g1_local_planner", "LocalPlannerTuning"))
