#!/usr/bin/env python
# Live-tunable g1_nav knobs (dynamic_reconfigure). Named "NavTuning" so the
# generated g1_nav::NavTuningConfig does not clash with the core g1_nav::NavConfig
# struct. Structural params (topics, frames, rate, services) are static YAML and
# not exposed here. Every default matches the corresponding struct code default in
# nav_types.h (NavConfig / WatchdogConfig).
PACKAGE = "g1_nav"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ---- FSM timeouts + auto_arm (NavConfig live subset) ----
gen.add("plan_timeout", double_t, 0,
        "PLAN without TRACKING for this long -> RECOVER (s)",
        5.0, 0.0, 120.0)
gen.add("replan_timeout", double_t, 0,
        "REPLAN without a fresh path for this long -> RECOVER (s)",
        3.0, 0.0, 60.0)
gen.add("goal_timeout", double_t, 0,
        "Per-goal total wall time before ABORTED_TIMEOUT (s; 0 = unbounded)",
        9999.0, 0.0, 99999.0)
gen.add("no_path_grace", double_t, 0,
        "TRACK must see NO_PATH for this long before -> REPLAN (debounce, s)",
        1.0, 0.0, 10.0)
gen.add("auto_arm", bool_t, 0,
        "Emit arm on goal accept and halt on terminal/cancel",
        True)

# ---- Blocked-goal RETRY (NavConfig retry subset) ----
gen.add("retry_budget", double_t, 0,
        "RETRY hold+replan budget before ABORTED_BLOCKED_TIMEOUT (s; <=0 unbounded)",
        120.0, 0.0, 600.0)
gen.add("retry_replan_interval", double_t, 0,
        "RETRY re-forward-goal cadence (s)",
        1.0, 0.1, 10.0)

# ---- ProgressWatchdog (WatchdogConfig live subset) ----
gen.add("stuck_window", double_t, 0,
        "Rolling window over which net displacement is measured (s)",
        8.0, 0.5, 60.0)
gen.add("stuck_dist", double_t, 0,
        "Min net displacement in stuck_window to count as progress (m)",
        0.10, 0.0, 2.0)

exit(gen.generate(PACKAGE, "g1_nav", "NavTuning"))
